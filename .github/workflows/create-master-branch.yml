name: Create Master Branch

on:
  workflow_dispatch:

jobs:
  create-master:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Create and push master branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if master branch exists locally
          if git show-ref --verify --quiet refs/heads/master; then
            echo "Master branch already exists locally"
            git checkout master
          else
            echo "Creating master branch from current branch"
            git checkout -b master
          fi
          
          # Push the master branch to remote
          git push origin master
          
          echo "Master branch created and pushed successfully"
